name: 'Build Plugin'

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        working-directory: tests/Jellyfin.Plugin.Lastfm.Tests
        run: dotnet test -c Release

  call:
    needs: test
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
